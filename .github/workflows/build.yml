name: Build OwpenGram
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build for Android
        run: |
          GOOS=android GOARCH=arm64 go build -ldflags "-checklinkname=0" -o owpengram-server ./cmd/telesrv
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: owpengram-server-binary
          path: owpengram-server
